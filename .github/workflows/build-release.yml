name: Build and Release CoreDNS Controller

on:
  push:
    tags:
      - 'v*.*.*' # 例如 v1.0.0, v1.2.3

env:
  APP_NAME: ODNSController
  GO_VERSION: '1.21' # 指定 Go 版本
  PYTHON_VERSION: '3.9' # 指定 Python 版本
  COREDNS_REPO_URL: 'https://github.com/coredns/coredns.git' # 仍然需要克隆官方源码结构
  COREDNS_PLUGIN_IMPORT_PATH: 'github.com/reflyable/odns/vpn-send' # 您的插件导入路径，用于 go get

jobs:
  build-and-package:
    name: Build App (${{ matrix.os_display }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_display: Windows
            os_runner: windows-latest
            goos: windows
            goarch: amd64
            python_arch: x64
            coredns_output_name: coredns.exe # PyInstaller 将查找此名称
            archive_format: zip
            final_artifact_suffix: windows-amd64.zip
          - os_display: Linux
            os_runner: ubuntu-latest
            goos: linux
            goarch: amd64
            python_arch: x64
            coredns_output_name: coredns # PyInstaller 将查找此名称
            archive_format: tar
            final_artifact_suffix: linux-amd64.tar.gz
          - os_display: macOS
            os_runner: macos-13
            goos: darwin
            goarch: amd64
            python_arch: x64
            coredns_output_name: coredns # PyInstaller 将查找此名称
            archive_format: zip
            final_artifact_suffix: macos-amd64.zip
          - os_display: macOS
            os_runner: macos-15
            goos: darwin
            goarch: arm64
            python_arch: arm64
            coredns_output_name: coredns # PyInstaller 将查找此名称
            archive_format: zip
            final_artifact_suffix: macos-arm64.zip
    runs-on: ${{ matrix.os_runner }}
    outputs:
      artifact_name: ${{ env.APP_NAME }}-${{ matrix.final_artifact_suffix }}
      artifact_path: ./${{ env.APP_NAME }}-${{ matrix.final_artifact_suffix }}

    steps:
      - name: Checkout Application Code (including custom plugin.cfg)
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Make (Windows only)
        if: matrix.goos == 'windows'
        shell: pwsh # PowerShell for choco
        run: |
          Write-Host "正在 Windows 上安装 Make..."
          choco install make --no-progress -y
          # 验证 make 是否在 PATH 中
          (Get-Command make).Path
          Write-Host "Make 安装完成 (或已存在)。"
          Write-Host "正在 Windows 上安装 Zip..."
          choco install make --no-progress -y
          # 验证 make 是否在 PATH 中
          (Get-Command make).Path
          Write-Host "Make 安装完成 (或已存在)。"

      - name: Build Custom CoreDNS using local plugin.cfg and Make
        shell: bash # bash 保证脚本在各平台行为一致
        run: |
          echo "正在克隆 CoreDNS 官方仓库源码结构: ${{ env.COREDNS_REPO_URL }}"
          git clone --depth 1 ${{ env.COREDNS_REPO_URL }} coredns_source_temp
          cd coredns_source_temp
          
          echo "正在修改 CoreDNS 源码中的 plugin.cfg"
          cp ../plugin.cfg ./plugin.cfg
          
          echo "--- coredns_source_temp/plugin.cfg 内容预览 (替换后) ---"
          cat ./plugin.cfg
          echo "---------------------------------------------------------"

    
          echo "正在为 ${{ matrix.goos }}/${{ matrix.goarch }} 使用 make 构建 CoreDNS..."
          export CGO_ENABLED=0
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          
          # CoreDNS 的 Makefile 通常有一个 'coredns' 目标或默认目标来构建二进制文件
          # 它应该会尊重 GOOS 和 GOARCH 环境变量
          make
          
          # 确定 'make' 生成的二进制文件的实际名称
          # Makefile 通常在当前目录 (即 coredns_source_temp) 生成 'coredns' 或 'coredns.exe'
          BUILT_BINARY_IN_SOURCE_DIR="coredns"
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            if [ -f "./coredns.exe" ]; then
              BUILT_BINARY_IN_SOURCE_DIR="coredns.exe"
            elif [ ! -f "./coredns" ]; then # 再次检查，以防万一
               echo "错误: make 后在 coredns_source_temp/ 中未找到 coredns 或 coredns.exe!"
               ls -la . # 列出文件以供调试
               exit 1
            fi
          elif [ ! -f "./coredns" ]; then
            echo "错误: make 后在 coredns_source_temp/ 中未找到 coredns!"
            ls -la . # 列出文件以供调试
            exit 1
          fi
          
          echo "make 构建完成，在 coredns_source_temp/ 中生成的二进制文件是: ${BUILT_BINARY_IN_SOURCE_DIR}"
          # 将编译结果从 coredns_source_temp 移动到工作区根目录，并重命名为 matrix.coredns_output_name
          # matrix.coredns_output_name 定义了 PyInstaller 期望的文件名 (例如 coredns.exe 或 coredns)
          mv "./${BUILT_BINARY_IN_SOURCE_DIR}" "../${{ matrix.coredns_output_name }}"
          
          cd .. # 返回到工作区根目录
          if [ ! -f "./${{ matrix.coredns_output_name }}" ]; then
            echo "错误: CoreDNS (${{ matrix.coredns_output_name }}) 移动或重命名失败!"
            exit 1
          fi
          echo "CoreDNS (${{ matrix.coredns_output_name }}) 构建成功并移动到 $(pwd)"
          ls -l ./${{ matrix.coredns_output_name }}
          # 清理临时克隆的 CoreDNS 源码
          echo "正在清理临时 CoreDNS 源码目录 coredns_source_temp..."
          rm -rf coredns_source_temp
          echo "清理完成。"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.python_arch }}

      - name: Install Python Dependencies and Build Tools
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt # 包含 PyQt6, psutil
          pip install pyinstaller # PyInstaller 用于打包
          if [[ "${{ matrix.goos }}" == "darwin" ]]; then
            pip install dmgbuild # dmgbuild 用于创建 macOS DMG
          fi

        
      - name: Install UPX Action (for final app on Win/Lin)
        if: matrix.goos == 'linux' || matrix.goos == 'windows'
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest


      - name: Package PyQt6 Application using build.py
        shell: bash
        run: |
          echo "当前工作目录: $(pwd)"
          echo "正在运行 build.py..."
          ls -la # 列出文件，确认 coredns 和 corefile 存在
          python build.py # build.py 应将 coredns 和 corefile 打包

          echo "PyInstaller 构建完成。检查 dist/ 目录..."
          ls -lR dist/
          if [[ "${{ matrix.goos }}" == "darwin" ]]; then
            if [ ! -d "./dist/${{ env.APP_NAME }}.app" ]; then
              echo "错误: 未找到 macOS 包: ./dist/${{ env.APP_NAME }}"
              exit 1
            fi
          elif [[ "${{ matrix.goos }}" == "windows" ]]; then
            if [ ! -f "./dist/${{ env.APP_NAME }}.exe" ]; then
              echo "错误: 未找到 Windows .exe 文件: ./dist/${{ env.APP_NAME }}.exe"
              exit 1
            fi
          else # Linux
            if [ ! -f "./dist/${{ env.APP_NAME }}" ]; then
              echo "错误: 未找到 Linux 可执行文件: ./dist/${{ env.APP_NAME }}"
              exit 1
            fi
          fi
          echo "PyQt6 应用打包成功。"


      - name: Archive Application for Release(Zip)
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: "${{matrix.archive_format}}"
          filename: "../${{ env.APP_NAME }}-${{ matrix.final_artifact_suffix }}"
          directory: ./dist/

      - name: Upload Application Artifact for Release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.final_artifact_suffix }}
          path: ./${{ env.APP_NAME }}-${{ matrix.final_artifact_suffix }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-package
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-artifacts/

      - name: List downloaded artifacts for verification
        run: |
          echo "已下载的构建产物:"
          ls -R ./release-artifacts
          
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            自动发布版本 ${{ github.ref_name }}。
            包含 CoreDNS Controller 应用程序和自定义 CoreDNS 二进制文件。
            **注意**: 如果您在 macOS 上遇到 "无法打开，因为来自未经验证的开发者" 的问题，
            请尝试在终端中使用 `xattr -cr /Applications/${{ env.APP_NAME }}.app` 命令。
          draft: false
          prerelease: false
          files: |
            ./release-artifacts/${{ env.APP_NAME }}-windows-amd64.zip/${{ env.APP_NAME }}-windows-amd64.zip
            ./release-artifacts/${{ env.APP_NAME }}-linux-amd64.tar.gz/${{ env.APP_NAME }}-linux-amd64.tar.gz
            ./release-artifacts/${{ env.APP_NAME }}-macos-amd64.dmg/${{ env.APP_NAME }}-macos-amd64.dmg
            ./release-artifacts/${{ env.APP_NAME }}-macos-arm64.dmg/${{ env.APP_NAME }}-macos-arm64.dmg
